name: GlyphMend versioned release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Shared prerelease version, for example 2.1.0-beta.1
        type: string
        required: true

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: glyphmend-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and source branch
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Run versioned releases from the default branch (main).' >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo 'Use a SemVer prerelease such as 2.1.0-beta.1; stable releases remain gated on signing and validation.' >&2
            exit 1
          fi
          tag="glyphmend-v$VERSION"
          if git tag --list "$tag" | grep -Fxq "$tag"; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  browser:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional
      - run: npm run license:check
      - name: Set browser package metadata to the shared release version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          npm pkg set "version=$VERSION"
          npm pkg set "version=$VERSION" --workspace glyphmend-browser
      - name: Build the browser application
        run: npm run build:web
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/web-app
          VITE_LICENSE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/web-app/LICENSE
      - name: Package the browser application and notices
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          staging="release/GlyphMend-${VERSION}-browser"
          mkdir -p "$staging/site"
          cp -R web-app/dist/. "$staging/site/"
          cp web-app/LICENSE web-app/DEPENDENCIES.md "$staging/"
          node web-app/scripts/collect-third-party-notices.mjs "$staging/THIRD_PARTY_NOTICES"
          printf 'GlyphMend %s browser distribution\n' "$VERSION" > "$staging/VERSION.txt"
          mkdir -p release
          archive="release/GlyphMend-${VERSION}-browser.tar.gz"
          tar -czf "$archive" -C release "GlyphMend-${VERSION}-browser"
          sha256sum "$archive" > "release/SHA256SUMS-browser"
      - name: Generate the browser distribution SBOM
        run: npm sbom --workspace glyphmend-browser --sbom-format spdx --omit=dev > release/SBOM-browser.spdx.json
      - name: Attest browser release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glyphmend-release-browser
          path: release/*
          if-no-files-found: error
          retention-days: 30

  companion:
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/companion-release.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  desktop:
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/glyphmend-desktop-release.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  draft-release:
    needs: [validate, browser, companion, desktop]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download all product artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'glyphmend-release-*' --dir release-assets
      - name: Create one draft prerelease with all platform assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tag="glyphmend-v$VERSION"
          test -d release-assets
          mapfile -d '' assets < <(find release-assets -maxdepth 2 -type f -print0 | sort -z)
          if ((${#assets[@]} == 0)); then
            echo 'No product release assets were downloaded.' >&2
            exit 1
          fi
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GlyphMend $VERSION" \
            --notes "Unsigned prerelease packages for GlyphMend $VERSION. Browser, standalone Companion, and Desktop artifacts share this version. Verify each SHA256SUMS file and the accompanying SBOMs before distribution. The draft remains unpublished until a maintainer reviews and publishes it." \
            --draft \
            --prerelease

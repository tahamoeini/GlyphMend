name: GlyphMend manual CI and release workflow

on:
  workflow_dispatch:
    inputs:
      validation:
        description: Manually choose checks, full validation, benchmark, or release; there are no automatic triggers
        type: choice
        options: [quick, full, benchmark, release]
        default: quick
        required: true
      repeats:
        description: Paired runs per benchmark document class
        type: choice
        options: ['3', '5']
        default: '3'
        required: true
      ocr_accuracy:
        description: Companion OCR model to measure
        type: choice
        options: [fast, high-accuracy]
        default: fast
        required: true

permissions:
  contents: read

concurrency:
  group: glyphmend-platform-${{ github.workflow }}-${{ github.ref }}-${{ inputs.validation || 'quick' }}
  cancel-in-progress: false

jobs:
  web-checks:
    if: inputs.validation == 'quick' || inputs.validation == 'full' || inputs.validation == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install all JavaScript workspaces
        run: npm ci --include=optional
      - run: npm run license:check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Build browser/PWA frontend
        run: npm run build:web
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/web-app
          VITE_LICENSE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/web-app/LICENSE
      - name: Build desktop frontend
        run: npm run build:desktop:web
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/web-app
          VITE_LICENSE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/web-app/LICENSE
      - name: Ensure generated branding is committed
        run: git diff --exit-code -- branding.json brand web-app/src/shared/brand.js web-app/src/styles/style.css
      - if: inputs.validation == 'quick'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: glyphmend-browser-${{ github.sha }}
          path: web-app/dist
          if-no-files-found: error
          retention-days: 14

  rust-checks:
    if: inputs.validation == 'full' || inputs.validation == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build the Desktop frontend for Tauri compilation
        run: |
          npm ci --include=optional
          npm run build:desktop:web
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          cache: false
      - name: Install Linux Tauri and OCR build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libtesseract-dev libleptonica-dev libcurl4-openssl-dev pkg-config patchelf
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: companion
      - name: Check Rust warnings
        run: cargo clippy --locked --workspace --exclude companion-tauri -- -D warnings
        working-directory: companion
      - name: Compile the Tauri host
        run: cargo check --locked -p companion-tauri
        working-directory: companion
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny
      - name: Check Rust dependency policy
        run: cargo deny check
        working-directory: companion

  web-tests:
    if: inputs.validation == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional
      - name: Run browser test suite
        run: npm test
      - name: Test desktop packaging integrity and dependency collection
        run: node --test companion/apps/companion-tauri/src-tauri/scripts/packaging.test.mjs

  companion-tests:
    if: inputs.validation == 'full'
    name: Companion tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.97.0
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install Linux OCR build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libtesseract-dev libleptonica-dev libcurl4-openssl-dev pkg-config
      - name: Install macOS OCR build dependencies
        if: runner.os == 'macOS'
        run: brew install tesseract leptonica
      - name: Install Windows OCR build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install tesseract:x64-windows
      - name: Configure dynamic Tesseract linking
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_DYNAMIC=1" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH
      - run: cargo test --locked --workspace --exclude companion-tauri
      - run: cargo build --locked -p companion-cli
      - run: cargo build --locked -p companion-bridge --example browser-runtime-e2e-host
      - run: node tests/browser-runtime-e2e.mjs

  desktop-tests:
    if: inputs.validation == 'full'
    name: Desktop tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            vcpkg_triplet: x64-windows-static-md
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
            macos_deployment_target: '15.0'
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            macos_deployment_target: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.97.0
          target: ${{ matrix.target }}
          components: rustfmt, clippy
          cache: false
      - name: Install Linux Tauri and OCR build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libtesseract-dev libleptonica-dev libcurl4-openssl-dev pkg-config patchelf
      - name: Install macOS OCR build dependencies
        if: runner.os == 'macOS'
        run: brew install tesseract leptonica pkg-config
      - name: Install statically linked Windows OCR dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
        run: |
          vcpkg install "tesseract:$env:VCPKG_TRIPLET"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=$env:VCPKG_TRIPLET" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_TRIPLET" >> $env:GITHUB_ENV
          "VCPKGRS_DYNAMIC=0" >> $env:GITHUB_ENV
      - run: npm ci --include=optional
      - run: npm run build:desktop:web
      - name: Test Tauri IPC adapter
        run: node --test companion/apps/companion-tauri/web/src/tauri-adapter.test.mjs
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: companion
      - name: Test Tauri service and bounded IPC assembly
        run: cargo test --locked -p companion-tauri --target ${{ matrix.target }}
        working-directory: companion
      - name: Build native Desktop host without packaging
        run: npm run tauri --workspace glyphmend-desktop-build-tools -- build --no-bundle --target ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target || '' }}

  paired-benchmarks:
    if: inputs.validation == 'benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.97.0
          cache: false
      - name: Install Linux OCR build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libtesseract-dev libleptonica-dev libcurl4-openssl-dev pkg-config
      - name: Verify Chromium availability
        run: google-chrome --version
      - run: npm ci --include=optional
      - name: Build Companion CLI
        run: cargo build --locked -p companion-cli
        working-directory: companion
      - name: Install checksum-pinned PDFium runtime
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8066/pdfium-linux-x64.tgz -o /tmp/pdfium.tgz
          echo '0b43f405477cf2cfc4dbff06905093c3309756c6bca1fb9da99234a2ca97fed2  /tmp/pdfium.tgz' | sha256sum --check
          mkdir -p /tmp/pdfium-runtime
          tar -xzf /tmp/pdfium.tgz -C /tmp/pdfium-runtime
          pdfium="$(find /tmp/pdfium-runtime -name libpdfium.so -print -quit)"
          test -n "$pdfium"
          cp -L "$pdfium" companion/target/debug/libpdfium.so
      - name: Install pinned English OCR models
        run: |
          set -euo pipefail
          root=companion/target/debug/tessdata
          mkdir -p "$root/fast" "$root/best"
          for model in fast best; do
            if [[ "$model" == fast ]]; then commit=87416418657359cb625c412a48b6e1d6d41c29bd; else commit=e12c65a915945e4c28e237a9b52bc4a8f39a0cec; fi
            curl -fsSL "https://raw.githubusercontent.com/tesseract-ocr/tessdata_$model/$commit/eng.traineddata" -o "$root/$model/eng.traineddata"
            printf '%s\n' "$commit" > "$root/$model/UPSTREAM_COMMIT"
          done
      - name: Verify labeled corpus
        run: node companion/benchmarks/check-corpus.mjs
      - name: Run repeated paired extraction benchmark
        env:
          GLYPHMEND_COMPANION: ${{ github.workspace }}/companion/target/debug/companion-cli
          GLYPHMEND_TESSDATA_DIR: ${{ github.workspace }}/companion/target/debug/tessdata
          CHROME_BIN: /usr/bin/google-chrome
          LD_LIBRARY_PATH: ${{ github.workspace }}/companion/target/debug
          BENCHMARK_REPEATS: ${{ inputs.repeats || '3' }}
          BENCHMARK_OCR_ACCURACY: ${{ inputs.ocr_accuracy || 'fast' }}
          OUTPUT_DIR: ${{ runner.temp }}/glyphmend-benchmarks
        run: |
          mkdir -p "$OUTPUT_DIR"
          node companion/benchmarks/run-benchmarks.mjs --repeats "$BENCHMARK_REPEATS" --ocr-accuracy "$BENCHMARK_OCR_ACCURACY" --output "$OUTPUT_DIR/raw-runs.json"
          node companion/benchmarks/evaluate-results.mjs "$OUTPUT_DIR/raw-runs.json" "$OUTPUT_DIR/paired-report.json"
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: glyphmend-companion-benchmarks-${{ inputs.ocr_accuracy || 'fast' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/glyphmend-benchmarks/
          if-no-files-found: warn
          retention-days: 90

  release-version:
    if: inputs.validation == 'release'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Calculate the next shared SemVer prerelease
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Run releases from the default branch (main).' >&2
            exit 1
          fi
          version="$(node web-app/scripts/next-release-version.mjs)"
          tag="glyphmend-v$version"
          if git tag --list "$tag" | grep -Fxq "$tag"; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next shared release version: $version"

  browser-package:
    if: inputs.validation == 'release'
    needs: [release-version, web-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=optional
      - run: npm run license:check
      - name: Set browser manifests and lockfile to the shared release version
        env:
          GLYPHMEND_VERSION: ${{ needs.release-version.outputs.version }}
        run: node web-app/scripts/set-release-version.mjs
      - name: Build the browser application
        run: npm run build:web
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/web-app
          VITE_LICENSE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/web-app/LICENSE
      - name: Package the browser application and current dependency notices
        shell: bash
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          set -euo pipefail
          staging_root="$RUNNER_TEMP/glyphmend-browser-stage"
          staging="$staging_root/GlyphMend-${VERSION}-browser"
          mkdir -p release
          mkdir -p "$staging/site"
          cp -R web-app/dist/. "$staging/site/"
          cp web-app/LICENSE "$staging/"
          node web-app/scripts/license-report.mjs --check > "$staging/DEPENDENCIES.md"
          node web-app/scripts/collect-third-party-notices.mjs "$staging/THIRD_PARTY_NOTICES"
          printf 'GlyphMend %s browser distribution\n' "$VERSION" > "$staging/VERSION.txt"
          archive="release/GlyphMend-${VERSION}-browser.tar.gz"
          tar -czf "$archive" -C "$staging_root" "GlyphMend-${VERSION}-browser"
      - name: Generate the browser distribution SBOM
        run: npm sbom --workspace glyphmend-browser --sbom-format spdx --omit=dev > release/SBOM-browser.spdx.json
      - name: Checksum the browser archive and SBOM
        run: node companion/apps/companion-tauri/src-tauri/scripts/write-release-checksums.mjs release SHA256SUMS-browser.txt
      - name: Attest browser release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: glyphmend-release-browser
          path: release/*
          if-no-files-found: error
          retention-days: 30

  desktop-package:
    if: inputs.validation == 'release'
    needs: [release-version, rust-checks]
    name: Desktop package (${{ matrix.platform }})
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            vcpkg_triplet: x64-windows-static-md
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: ubuntu-24.04-x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-intel
            macos_deployment_target: '15.0'
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-apple-silicon
            macos_deployment_target: '15.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      TARGET: ${{ matrix.target }}
      GLYPHMEND_VERSION: ${{ needs.release-version.outputs.version }}
      VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.97.0
          target: ${{ matrix.target }}
          components: rustfmt, clippy
          cache: false
      - name: Install Linux Tauri and OCR runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libtesseract-dev libleptonica-dev libcurl4-openssl-dev pkg-config patchelf
      - name: Install macOS OCR runtime dependencies
        if: runner.os == 'macOS'
        run: brew install tesseract leptonica pkg-config
      - name: Install statically linked Windows OCR dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install "tesseract:$env:VCPKG_TRIPLET"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=$env:VCPKG_TRIPLET" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_TRIPLET" >> $env:GITHUB_ENV
          "VCPKGRS_DYNAMIC=0" >> $env:GITHUB_ENV
      - name: Install JavaScript workspaces
        run: npm ci --include=optional
      - name: Set Tauri package version
        run: node companion/apps/companion-tauri/src-tauri/scripts/set-version.mjs
        env:
          GLYPHMEND_VERSION: ${{ needs.release-version.outputs.version }}
      - name: Prepare this runner's pinned PDFium and OCR resources
        run: npm run desktop:prepare
      - name: Build the single integrated Desktop application
        run: npm run build:desktop
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/web-app
          VITE_LICENSE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/web-app/LICENSE
      - name: Create release staging directory
        run: |
          node -e "require('node:fs').mkdirSync('release', { recursive: true })"
      - name: Install and inspect the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem companion/target/${{ matrix.target }}/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'GlyphMend Desktop Smoke'
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new($installer.FullName)
          $startInfo.ArgumentList.Add('/S')
          $startInfo.ArgumentList.Add("/D=$installDir")
          $process = [System.Diagnostics.Process]::Start($startInfo)
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($process.ExitCode)." }
          $manifest = Get-ChildItem -LiteralPath $installDir -Filter runtime-manifest.json -Recurse | Select-Object -First 1
          if (-not $manifest) { throw 'Installed bundle is missing its runtime manifest.' }
          $runtime = $manifest.Directory.FullName
          foreach ($relative in @('pdfium/pdfium.dll', 'tessdata/fast/eng.traineddata', 'tessdata/best/chi_sim.traineddata', 'notices/LICENSES.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtime $relative))) { throw "Installed runtime is missing $relative" }
          }
          "GLYPHMEND_TEST_RESOURCE_DIR=$($manifest.Directory.Parent.FullName)" >> $env:GITHUB_ENV
      - name: Smoke test the installed Windows runtime
        if: runner.os == 'Windows'
        working-directory: companion
        env:
          GLYPHMEND_RUNTIME_SMOKE: '1'
        run: |
          node apps/companion-tauri/src-tauri/scripts/validate-runtime.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p companion-tauri --test desktop_runtime --target ${{ matrix.target }}
      - name: Extract and inspect the Ubuntu package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find companion/target/${{ matrix.target }}/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$deb"
          root="$RUNNER_TEMP/GlyphMend Desktop Smoke"
          mkdir -p "$root"
          dpkg-deb --extract "$deb" "$root"
          test -f "$root/usr/lib/glyphmend/runtime/runtime-manifest.json"
          test -f "$root/usr/lib/glyphmend/runtime/pdfium/libpdfium.so"
          test -f "$root/usr/lib/glyphmend/runtime/tessdata/best/chi_sim.traineddata"
          test -f "$root/usr/lib/glyphmend/runtime/notices/LICENSES.txt"
          depends=$(dpkg-deb --field "$deb" Depends)
          for package in libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 libc6 libgcc-s1 libstdc++6; do
            [[ "$depends" == *"$package"* ]] || { echo "Missing Debian runtime dependency: $package" >&2; exit 1; }
          done
          executable=$(find "$root/usr/bin" -maxdepth 1 -type f -print -quit)
          test -n "$executable"
          LD_LIBRARY_PATH="$root/usr/lib/glyphmend/runtime/lib" ldd "$executable" | tee "$RUNNER_TEMP/glyphmend-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/glyphmend-ldd.txt"; then
            echo 'The extracted executable has unresolved shared libraries.' >&2
            exit 1
          fi
      - name: Smoke test the installed Ubuntu runtime
        if: runner.os == 'Linux'
        working-directory: companion
        env:
          GLYPHMEND_RUNTIME_SMOKE: '1'
          GLYPHMEND_TEST_RESOURCE_DIR: ${{ runner.temp }}/GlyphMend Desktop Smoke/usr/lib/glyphmend
          LD_LIBRARY_PATH: ${{ runner.temp }}/GlyphMend Desktop Smoke/usr/lib/glyphmend/runtime/lib
        run: |
          node apps/companion-tauri/src-tauri/scripts/validate-runtime.mjs
          cargo test --locked -p companion-tauri --test desktop_runtime --target ${{ matrix.target }}
      - name: Mount and inspect the macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find companion/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount="$RUNNER_TEMP/GlyphMend Desktop Smoke"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/GlyphMend.app"
          test -f "$app/Contents/Resources/runtime/runtime-manifest.json"
          test -f "$app/Contents/Resources/runtime/pdfium/libpdfium.dylib"
          test -f "$app/Contents/Resources/runtime/tessdata/best/chi_sim.traineddata"
          test -f "$app/Contents/Resources/runtime/notices/LICENSES.txt"
          executable=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)
          test -n "$executable"
          while IFS= read -r -d '' library; do
            if otool -L "$library" | grep -E '/opt/homebrew|/usr/local/(Cellar|opt)'; then
              echo "Unrelocated Homebrew reference in $library" >&2
              exit 1
            fi
            codesign --verify --strict "$library"
          done < <(find "$app/Contents/Resources/runtime" -type f -name '*.dylib' -print0)
          if otool -L "$executable" | grep -E '/opt/homebrew|/usr/local/(Cellar|opt)'; then
            echo 'The packaged executable still references Homebrew paths.' >&2
            exit 1
          fi
          export GLYPHMEND_RUNTIME_SMOKE=1
          export GLYPHMEND_TEST_RESOURCE_DIR="$mount/GlyphMend.app/Contents/Resources"
          export DYLD_LIBRARY_PATH="$mount/GlyphMend.app/Contents/Resources/runtime/lib${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}"
          node companion/apps/companion-tauri/src-tauri/scripts/validate-runtime.mjs
          cargo test --manifest-path companion/Cargo.toml --locked -p companion-tauri --test desktop_runtime --target ${{ matrix.target }}
      - name: Create native runtime SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: companion/apps/companion-tauri/src-tauri/resources/runtime
          format: spdx-json
          output-file: release/SBOM-${{ matrix.platform }}.spdx.json
          upload-artifact: false
      - name: Copy the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem companion/target/${{ matrix.target }}/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          Copy-Item -LiteralPath $installer.FullName -Destination "release/GlyphMend-$env:GLYPHMEND_VERSION-${{ matrix.platform }}.exe"
      - name: Copy the macOS or Ubuntu installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            macOS) installer=$(find companion/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit); extension=dmg ;;
            Linux) installer=$(find companion/target/${{ matrix.target }}/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit); extension=deb ;;
          esac
          test -n "$installer"
          cp "$installer" "release/GlyphMend-${GLYPHMEND_VERSION}-${{ matrix.platform }}.$extension"
      - name: Checksum this platform's installer and SBOM
        run: node companion/apps/companion-tauri/src-tauri/scripts/write-release-checksums.mjs release SHA256SUMS-${{ matrix.platform }}.txt
      - name: Attest the installer and SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: glyphmend-release-desktop-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    if: inputs.validation == 'release'
    needs: [release-version, browser-package, desktop-package]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download browser and integrated Desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'glyphmend-release-*' --dir release-assets
      - name: Create one draft prerelease for the shared version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          set -euo pipefail
          tag="glyphmend-v$VERSION"
          test -d release-assets
          mapfile -d '' assets < <(find release-assets -maxdepth 2 -type f -print0 | sort -z)
          if ((${#assets[@]} == 0)); then
            echo 'No product release assets were downloaded.' >&2
            exit 1
          fi
          duplicates=$(printf '%s\n' "${assets[@]##*/}" | sort | uniq -d)
          if [[ -n "$duplicates" ]]; then
            echo "Release assets have duplicate filenames: $duplicates" >&2
            exit 1
          fi
          while IFS= read -r -d '' checksum; do
            (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
          done < <(find release-assets -type f -name 'SHA256SUMS-*.txt' -print0)
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GlyphMend $VERSION" \
            --notes "Unsigned prerelease packages for GlyphMend $VERSION. The browser artifact and platform-specific integrated Desktop installers share this version. Desktop installers include the headless Companion engine; no separate Companion package is produced. Verify SHA256SUMS and the included SBOMs before distribution. The draft remains unpublished until a maintainer reviews and publishes it." \
            --draft \
            --prerelease

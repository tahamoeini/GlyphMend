name: GlyphMend browser app
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - name: Enforce lightweight browser test boundary
        shell: bash
        run: |
          if node -e 'const p=require("./package.json"); const d={...p.dependencies,...p.devDependencies,...p.optionalDependencies}; process.exit(Object.keys(d).some((n)=>n === "playwright" || n.startsWith("@playwright/")) ? 0 : 1)'; then
            echo "Playwright is intentionally forbidden in GlyphMend CI."
            exit 1
          fi
      - run: npm run license:check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build with source links for this exact revision
        run: npm run build
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/web-app
          VITE_LICENSE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/web-app/LICENSE
      - name: Ensure generated branding is committed
        run: git diff --exit-code -- branding.json brand web-app/src/shared/brand.js web-app/src/styles/style.css
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: glyphmend-browser
          path: web-app/dist
          if-no-files-found: error
          retention-days: 14

name: Optional Tauri validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-tauri-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tauri check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          cache: false
      - name: Install Linux Tauri and OCR build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libtesseract-dev libleptonica-dev libcurl4-openssl-dev pkg-config
      - name: Install macOS OCR build dependencies
        if: runner.os == 'macOS'
        run: brew install tesseract leptonica pkg-config
      - name: Install Windows OCR build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install tesseract:x64-windows
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_DYNAMIC=1" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installedd-windowsin" >> $env:GITHUB_PATH
      - name: Install browser platform dependencies
        run: npm ci
        working-directory: web-app
      - name: Assemble production web frontend and Tauri adapter
        run: node companion/apps/companion-tauri/web/build-tauri.mjs
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/web-app
          VITE_LICENSE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/web-app/LICENSE
      - name: Test Tauri IPC adapter
        run: node --test companion/apps/companion-tauri/web/src/tauri-adapter.test.mjs
      - name: Check Tauri Rust target
        run: cargo check --locked -p companion-tauri
        working-directory: companion

name: GlyphMend Desktop CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glyphmend-desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Desktop checks (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            vcpkg_triplet: x64-windows-static-md
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: 1.97.0
          target: ${{ matrix.target }}
          components: rustfmt, clippy
          cache: false
      - name: Install Linux Tauri and OCR build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libtesseract-dev libleptonica-dev libcurl4-openssl-dev pkg-config patchelf
      - name: Install macOS OCR build dependencies
        if: runner.os == 'macOS'
        run: brew install tesseract leptonica pkg-config
      - name: Install statically linked Windows OCR dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
        run: |
          vcpkg install "tesseract:$env:VCPKG_TRIPLET"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=$env:VCPKG_TRIPLET" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_TRIPLET" >> $env:GITHUB_ENV
          "VCPKGRS_DYNAMIC=0" >> $env:GITHUB_ENV
      - name: Install browser build dependencies
        run: npm ci
        working-directory: web-app
      - name: Install Tauri CLI
        run: npm ci --include=optional
        working-directory: companion/apps/companion-tauri/web
      - name: Build and verify browser frontend
        run: npm run build
        working-directory: web-app
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/web-app
          VITE_LICENSE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/web-app/LICENSE
      - name: Build and verify desktop frontend
        run: npm run build:desktop
        working-directory: web-app
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/web-app
          VITE_LICENSE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/web-app/LICENSE
      - name: Test bounded Tauri IPC adapter
        run: node --test companion/apps/companion-tauri/web/src/tauri-adapter.test.mjs
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: companion
      - name: Test Tauri service and bounded IPC assembly
        run: cargo test --locked -p companion-tauri --target ${{ matrix.target }}
        working-directory: companion
      - name: Build native Desktop host without packaging
        run: npm run tauri -- build --no-bundle --target ${{ matrix.target }}
        working-directory: companion/apps/companion-tauri/web
        env:
          TARGET: ${{ matrix.target }}
          VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/web-app
          VITE_LICENSE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/web-app/LICENSE
